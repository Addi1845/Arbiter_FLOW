<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1424"/>
      <stop offset="100%" stop-color="#141E30"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Scale of Justice -->
  <!-- Center pillar -->
  <line x1="16" y1="7" x2="16" y2="24" stroke="#D4A017" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Base -->
  <line x1="11" y1="24" x2="21" y2="24" stroke="#D4A017" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Top beam -->
  <line x1="7" y1="10" x2="25" y2="10" stroke="#D4A017" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Left chain -->
  <line x1="9" y1="10" x2="9" y2="16" stroke="#0ECFC0" stroke-width="1" stroke-linecap="round"/>
  <!-- Right chain -->
  <line x1="23" y1="10" x2="23" y2="14" stroke="#0ECFC0" stroke-width="1" stroke-linecap="round"/>
  <!-- Left pan (lower — weighing) -->
  <path d="M5 16 Q9 19 13 16" stroke="#0ECFC0" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- Right pan (higher) -->
  <path d="M19 14 Q23 17 27 14" stroke="#0ECFC0" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- Top diamond accent -->
  <circle cx="16" cy="7" r="1.5" fill="#D4A017"/>
</svg>