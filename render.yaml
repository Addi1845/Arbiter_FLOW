services:
  - type: web
    name: arbiter-flow-2
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://arbiter-flow.vercel.app,https://arbiter-flow-m1sy.vercel.app
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
